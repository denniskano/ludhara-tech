apiVersion: apps/v1
kind: Deployment
metadata:
  name: consumer-cuenta-360
spec:
  # KEDA maneja las réplicas entre 2 y 6 (ver keda-scaledobject.yaml).
  replicas: 2
  selector:
    matchLabels:
      app: consumer-cuenta-360
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Un pod a la vez: cada cambio de miembros rebalancea los 10 consumer groups.
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: consumer-cuenta-360
    spec:
      # quarkus.shutdown.timeout (30 s) + margen para cerrar los consumers y confirmar offsets.
      terminationGracePeriodSeconds: 45
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: consumer-cuenta-360
      containers:
        - name: app
          image: consumer-cuenta-360:1.0.0
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: JAVA_OPTS_APPEND
              value: "-XX:MaxRAMPercentage=75 -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError"
          envFrom:
            - secretRef:
                name: consumer-cuenta-360-confluent
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              # Sin límite de CPU: el throttling del CFS frena el poll y dispara rebalances.
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /q/health/started
              port: http
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: http
            periodSeconds: 10
            failureThreshold: 3
          # Baja cuando un channel reporta una falla (Schema Registry caído más de 2 min, un mensaje más de
          # 5 min sin procesarse, DLQ que no acepta la escritura). SmallRye no la limpia: reiniciar es la recuperación.
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: http
            periodSeconds: 20
            failureThreshold: 3
