mp.messaging.incoming.tarjeta-emitida.topic=tarjeta-emitida
mp.messaging.incoming.tarjeta-emitida.group.id=cuenta-360.tarjeta-emitida
mp.messaging.incoming.tarjeta-emitida.specific.avro.value.type=tech.ludhara.cuenta360.eventos.TarjetaEmitida
