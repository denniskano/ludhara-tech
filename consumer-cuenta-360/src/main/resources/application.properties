quarkus.application.name=consumer-cuenta-360

# =============================================================================
# Cliente Kafka (kafka.* aplica a los 10 consumers y a sus productores de DLQ)
# En dev/test Quarkus levanta Kafka y un Schema Registry con Dev Services.
# =============================================================================
%prod.kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS}
%prod.kafka.security.protocol=SASL_SSL
%prod.kafka.sasl.mechanism=PLAIN
%prod.kafka.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="${KAFKA_API_KEY}" password="${KAFKA_API_SECRET}";
kafka.client.dns.lookup=use_all_dns_ips

%prod.kafka.schema.registry.url=${SCHEMA_REGISTRY_URL}
%prod.kafka.basic.auth.credentials.source=USER_INFO
%prod.kafka.basic.auth.user.info=${SCHEMA_REGISTRY_API_KEY}:${SCHEMA_REGISTRY_API_SECRET}
# Solo lo usa el serializer de las DLQ: en prod los subjects <dlq>-value se registran por IaC.
%prod.kafka.auto.register.schemas=false

# Membresía y rebalance
kafka.session.timeout.ms=45000
# Debe superar cuenta360.schema-registry.retry.max-duration: ese reintento bloquea el poll.
kafka.max.poll.interval.ms=300000
kafka.partition.assignment.strategy=org.apache.kafka.clients.consumer.CooperativeStickyAssignor

# Fetch: 500 TPS por tópico, ~1 KB por evento. Agrupa en vez de un fetch por mensaje
# y acota la memoria: 10 consumers x 8 MB como techo.
kafka.fetch.min.bytes=32768
kafka.fetch.max.wait.ms=100
kafka.max.partition.fetch.bytes=1048576
kafka.fetch.max.bytes=8388608
kafka.max.poll.records=200

kafka.enable.auto.commit=false
kafka.auto.offset.reset=earliest

# =============================================================================
# Defaults del conector para los 10 channels
# =============================================================================
mp.messaging.connector.smallrye-kafka.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.connector.smallrye-kafka.value.deserializer=io.confluent.kafka.serializers.KafkaAvroDeserializer
mp.messaging.connector.smallrye-kafka.specific.avro.reader=true
mp.messaging.connector.smallrye-kafka.value-deserialization-failure-handler=avro-schema-registry

# DLQ: veneno con los bytes originales; error de negocio con el mismo Avro de entrada.
mp.messaging.connector.smallrye-kafka.failure-strategy=dead-letter-queue

# Throttled confirma el offset contiguo más alto procesado: seguro con ordered=false.
mp.messaging.connector.smallrye-kafka.commit-strategy=throttled
mp.messaging.connector.smallrye-kafka.throttled.unprocessed-record-max-age.ms=300000

# Backpressure: con más de max.poll.records x 2 en cola, SmallRye pausa las particiones.
mp.messaging.connector.smallrye-kafka.max-queue-size-factor=2
mp.messaging.connector.smallrye-kafka.graceful-shutdown=true

# Reintento de Schema Registry dentro del poll
cuenta360.schema-registry.retry.initial-backoff=PT0.5S
cuenta360.schema-registry.retry.max-backoff=PT10S
cuenta360.schema-registry.retry.max-duration=PT2M

# =============================================================================
# Pools: uno por channel, para que un downstream lento no frene a los otros 9.
# Concurrencia por pod = (500 TPS / pods) x latencia del downstream x 3 de holgura.
# 2 pods y 20 ms: 250 x 0.02 x 3 = 15.
# =============================================================================
cuenta360.worker.max-concurrency=16
smallrye.messaging.worker.cuenta-abierta-pool.max-concurrency=${cuenta360.worker.max-concurrency}
smallrye.messaging.worker.cuenta-cerrada-pool.max-concurrency=${cuenta360.worker.max-concurrency}
smallrye.messaging.worker.movimiento-registrado-pool.max-concurrency=${cuenta360.worker.max-concurrency}
smallrye.messaging.worker.transferencia-enviada-pool.max-concurrency=${cuenta360.worker.max-concurrency}
smallrye.messaging.worker.transferencia-recibida-pool.max-concurrency=${cuenta360.worker.max-concurrency}
smallrye.messaging.worker.pago-servicio-realizado-pool.max-concurrency=${cuenta360.worker.max-concurrency}
smallrye.messaging.worker.tarjeta-emitida-pool.max-concurrency=${cuenta360.worker.max-concurrency}
smallrye.messaging.worker.tarjeta-bloqueada-pool.max-concurrency=${cuenta360.worker.max-concurrency}
smallrye.messaging.worker.cliente-actualizado-pool.max-concurrency=${cuenta360.worker.max-concurrency}
smallrye.messaging.worker.limite-actualizado-pool.max-concurrency=${cuenta360.worker.max-concurrency}

# Con los valores por defecto, Quarkus 3.31 fuerza el cierre de los pools al apagar e interrumpe lo que está en proceso.
# El timeout tiene que caber dentro de quarkus.shutdown.timeout y del terminationGracePeriodSeconds del pod.
cuenta360.worker.shutdown-timeout-ms=20000
cuenta360.worker.shutdown-check-interval-ms=500
smallrye.messaging.worker.cuenta-abierta-pool.shutdown-timeout=${cuenta360.worker.shutdown-timeout-ms}
smallrye.messaging.worker.cuenta-cerrada-pool.shutdown-timeout=${cuenta360.worker.shutdown-timeout-ms}
smallrye.messaging.worker.movimiento-registrado-pool.shutdown-timeout=${cuenta360.worker.shutdown-timeout-ms}
smallrye.messaging.worker.transferencia-enviada-pool.shutdown-timeout=${cuenta360.worker.shutdown-timeout-ms}
smallrye.messaging.worker.transferencia-recibida-pool.shutdown-timeout=${cuenta360.worker.shutdown-timeout-ms}
smallrye.messaging.worker.pago-servicio-realizado-pool.shutdown-timeout=${cuenta360.worker.shutdown-timeout-ms}
smallrye.messaging.worker.tarjeta-emitida-pool.shutdown-timeout=${cuenta360.worker.shutdown-timeout-ms}
smallrye.messaging.worker.tarjeta-bloqueada-pool.shutdown-timeout=${cuenta360.worker.shutdown-timeout-ms}
smallrye.messaging.worker.cliente-actualizado-pool.shutdown-timeout=${cuenta360.worker.shutdown-timeout-ms}
smallrye.messaging.worker.limite-actualizado-pool.shutdown-timeout=${cuenta360.worker.shutdown-timeout-ms}
smallrye.messaging.worker.cuenta-abierta-pool.shutdown-check-interval=${cuenta360.worker.shutdown-check-interval-ms}
smallrye.messaging.worker.cuenta-cerrada-pool.shutdown-check-interval=${cuenta360.worker.shutdown-check-interval-ms}
smallrye.messaging.worker.movimiento-registrado-pool.shutdown-check-interval=${cuenta360.worker.shutdown-check-interval-ms}
smallrye.messaging.worker.transferencia-enviada-pool.shutdown-check-interval=${cuenta360.worker.shutdown-check-interval-ms}
smallrye.messaging.worker.transferencia-recibida-pool.shutdown-check-interval=${cuenta360.worker.shutdown-check-interval-ms}
smallrye.messaging.worker.pago-servicio-realizado-pool.shutdown-check-interval=${cuenta360.worker.shutdown-check-interval-ms}
smallrye.messaging.worker.tarjeta-emitida-pool.shutdown-check-interval=${cuenta360.worker.shutdown-check-interval-ms}
smallrye.messaging.worker.tarjeta-bloqueada-pool.shutdown-check-interval=${cuenta360.worker.shutdown-check-interval-ms}
smallrye.messaging.worker.cliente-actualizado-pool.shutdown-check-interval=${cuenta360.worker.shutdown-check-interval-ms}
smallrye.messaging.worker.limite-actualizado-pool.shutdown-check-interval=${cuenta360.worker.shutdown-check-interval-ms}

# =============================================================================
# Channels: tópico, consumer group propio, clase lectora del esquema y DLQ propia.
# specific.avro.value.type fija la clase: el esquema del productor se resuelve contra ella.
# =============================================================================
mp.messaging.incoming.cuenta-abierta.topic=cuenta-abierta
mp.messaging.incoming.cuenta-abierta.group.id=cuenta-360.cuenta-abierta
mp.messaging.incoming.cuenta-abierta.specific.avro.value.type=tech.ludhara.cuenta360.eventos.CuentaAbierta
mp.messaging.incoming.cuenta-abierta.dead-letter-queue.topic=cuenta-360.cuenta-abierta.dlq

mp.messaging.incoming.cuenta-cerrada.topic=cuenta-cerrada
mp.messaging.incoming.cuenta-cerrada.group.id=cuenta-360.cuenta-cerrada
mp.messaging.incoming.cuenta-cerrada.specific.avro.value.type=tech.ludhara.cuenta360.eventos.CuentaCerrada
mp.messaging.incoming.cuenta-cerrada.dead-letter-queue.topic=cuenta-360.cuenta-cerrada.dlq

mp.messaging.incoming.movimiento-registrado.topic=movimiento-registrado
mp.messaging.incoming.movimiento-registrado.group.id=cuenta-360.movimiento-registrado
mp.messaging.incoming.movimiento-registrado.specific.avro.value.type=tech.ludhara.cuenta360.eventos.MovimientoRegistrado
mp.messaging.incoming.movimiento-registrado.dead-letter-queue.topic=cuenta-360.movimiento-registrado.dlq

mp.messaging.incoming.transferencia-enviada.topic=transferencia-enviada
mp.messaging.incoming.transferencia-enviada.group.id=cuenta-360.transferencia-enviada
mp.messaging.incoming.transferencia-enviada.specific.avro.value.type=tech.ludhara.cuenta360.eventos.TransferenciaEnviada
mp.messaging.incoming.transferencia-enviada.dead-letter-queue.topic=cuenta-360.transferencia-enviada.dlq

mp.messaging.incoming.transferencia-recibida.topic=transferencia-recibida
mp.messaging.incoming.transferencia-recibida.group.id=cuenta-360.transferencia-recibida
mp.messaging.incoming.transferencia-recibida.specific.avro.value.type=tech.ludhara.cuenta360.eventos.TransferenciaRecibida
mp.messaging.incoming.transferencia-recibida.dead-letter-queue.topic=cuenta-360.transferencia-recibida.dlq

mp.messaging.incoming.pago-servicio-realizado.topic=pago-servicio-realizado
mp.messaging.incoming.pago-servicio-realizado.group.id=cuenta-360.pago-servicio-realizado
mp.messaging.incoming.pago-servicio-realizado.specific.avro.value.type=tech.ludhara.cuenta360.eventos.PagoServicioRealizado
